<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar Contraseña</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="dashboard-page">

    <!-- Navbar -->
    <nav class="navbar-glass" id="navbar">
        <div class="container d-flex justify-content-between align-items-center py-3">
            <a href="../index.html" class="navbar-brand d-flex align-items-center gap-2 text-decoration-none">
                <img src="../assets/logo.svg" alt="Carlos Mori" class="navbar-logo">
                <span class="fw-bold text-dark">Carlos Mori</span>
            </a>
            <div class="d-flex align-items-center gap-2">
                <a href="dashboard.html" class="nav-pill">
                    <i class="bi bi-speedometer2 me-1"></i>Dashboard
                </a>
                <a href="auditoria.html" class="nav-pill">
                    <i class="bi bi-clipboard-data me-1"></i>Auditoría
                </a>
                <a href="proveedores.html" class="nav-pill">
                    <i class="bi bi-truck me-1"></i>Proveedores
                </a>
                <a href="inventario.html" class="nav-pill">
                    <i class="bi bi-boxes me-1"></i>Inventario
                </a>
                <a href="codigo-barras.html" class="nav-pill">
                    <i class="bi bi-upc-scan me-1"></i>Códigos de Barras
                </a>
                <button class="nav-pill btn-logout" id="btnLogout">
                    <i class="bi bi-box-arrow-right me-1"></i>Salir
                </button>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div class="container py-4">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
                    <div class="card-table" style="animation: popIn 0.4s ease-out;">
                        <div class="text-center mb-4 pt-4">
                            <div class="login-icon-wrapper mb-3">
                                <i class="bi bi-key login-main-icon" style="color: #0ea5e9;"></i>
                            </div>
                            <h4 class="fw-bold mb-1">Cambiar Contraseña</h4>
                            <p class="text-secondary small">Actualice su contraseña de acceso</p>
                        </div>

                        <form id="changePasswordForm" class="px-3 pb-4" novalidate>
                            <div class="mb-3" id="currentPasswordGroup">
                                <label for="currentPassword" class="form-label">
                                    <i class="bi bi-lock me-1"></i>Contraseña Actual
                                </label>
                                <div class="input-icon-wrapper">
                                    <i class="bi bi-lock input-icon"></i>
                                    <input type="password" class="form-control" id="currentPassword"
                                           placeholder="Ingrese su contraseña actual" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="newPassword" class="form-label">
                                    <i class="bi bi-key me-1"></i>Nueva Contraseña
                                </label>
                                <div class="input-icon-wrapper">
                                    <i class="bi bi-key input-icon"></i>
                                    <input type="password" class="form-control" id="newPassword"
                                           placeholder="Mínimo 4 caracteres" minlength="4" required>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="confirmPassword" class="form-label">
                                    <i class="bi bi-key-fill me-1"></i>Confirmar Contraseña
                                </label>
                                <div class="input-icon-wrapper">
                                    <i class="bi bi-key-fill input-icon"></i>
                                    <input type="password" class="form-control" id="confirmPassword"
                                           placeholder="Repita la nueva contraseña" minlength="4" required>
                                </div>
                            </div>

                            <div id="changeError" class="alert alert-danger d-none" role="alert">
                                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                                <span id="changeErrorText"></span>
                            </div>

                            <div id="changeSuccess" class="alert alert-success d-none" role="alert">
                                <i class="bi bi-check-circle-fill me-2"></i>
                                <span id="changeSuccessText"></span>
                            </div>

                            <button type="submit" class="btn btn-celeste w-100 py-2" id="btnChange">
                                <i class="bi bi-shield-lock me-2"></i>Actualizar Contraseña
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/app.js"></script>
    <script>
        const user = JSON.parse(localStorage.getItem('user'));
        const token = localStorage.getItem('token');

        document.addEventListener('DOMContentLoaded', () => {
            if (!token || !user) {
                window.location.href = '../index.html';
                return;
            }

            // If admin, no need for current password (optionally)
            if (user.rol === 'admin') {
                document.getElementById('currentPasswordGroup').style.display = 'none';
            }

            window.addEventListener('scroll', () => {
                const navbar = document.getElementById('navbar');
                navbar.classList.toggle('scrolled', window.scrollY > 40);
            });

            document.getElementById('btnLogout').addEventListener('click', () => {
                localStorage.removeItem('token');
                localStorage.removeItem('user');
                window.location.href = '../index.html';
            });

            document.getElementById('changePasswordForm').addEventListener('submit', handleChangePassword);
        });

        async function handleChangePassword(e) {
            e.preventDefault();
            const btn = document.getElementById('btnChange');
            const errorDiv = document.getElementById('changeError');
            const errorText = document.getElementById('changeErrorText');
            const successDiv = document.getElementById('changeSuccess');
            const successText = document.getElementById('changeSuccessText');

            errorDiv.classList.add('d-none');
            successDiv.classList.add('d-none');

            const currentPassword = document.getElementById('currentPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // Validations
            if (user.rol !== 'admin' && !currentPassword) {
                errorDiv.classList.remove('d-none');
                errorText.textContent = 'Ingrese su contraseña actual';
                return;
            }

            if (!newPassword || newPassword.length < 4) {
                errorDiv.classList.remove('d-none');
                errorText.textContent = 'La nueva contraseña debe tener al menos 4 caracteres';
                return;
            }

            if (newPassword !== confirmPassword) {
                errorDiv.classList.remove('d-none');
                errorText.textContent = 'Las contraseñas no coinciden';
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="bi bi-arrow-repeat spin me-2"></i>Procesando...';

            try {
                const res = await fetch('/api/auth/cambiar-contrasena', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        userId: user.id,
                        passwordActual: currentPassword,
                        nuevaPassword: newPassword,
                        esAdminCambiandoOtro: user.rol === 'admin'
                    })
                });

                const data = await res.json();

                if (data.success) {
                    successDiv.classList.remove('d-none');
                    successText.textContent = data.message;
                    document.getElementById('changePasswordForm').reset();
                    btn.innerHTML = '<i class="bi bi-check-circle me-2"></i>¡Actualizado!';
                    btn.classList.add('btn-success');
                    showToast('Contraseña actualizada correctamente', 'success');
                    setTimeout(() => {
                        btn.disabled = false;
                        btn.classList.remove('btn-success');
                        btn.innerHTML = '<i class="bi bi-shield-lock me-2"></i>Actualizar Contraseña';
                    }, 2000);
                } else {
                    errorDiv.classList.remove('d-none');
                    errorText.textContent = data.message;
                    btn.disabled = false;
                    btn.innerHTML = '<i class="bi bi-shield-lock me-2"></i>Actualizar Contraseña';
                }
            } catch (error) {
                errorDiv.classList.remove('d-none');
                errorText.textContent = 'Error de conexión con el servidor';
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-shield-lock me-2"></i>Actualizar Contraseña';
            }
        }
    </script>
</body>
</html>
